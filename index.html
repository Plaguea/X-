<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Browser</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: white;
}

#bar {
  display: flex;
  padding: 10px;
  background: #222;
}

input {
  flex: 1;
  padding: 8px;
  font-size: 16px;
  border: none;
}

button {
  padding: 8px;
  margin-left: 5px;
}

iframe {
  width: 100%;
  height: 90vh;
  border: none;
}
</style>
</head>

<body>

<div id="bar">
  <input id="url" placeholder="Enter URL">
  <button onclick="go()">Go</button>
</div>

<iframe id="viewer"></iframe>

<script>
function go() {
  let url = document.getElementById("url").value;
  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

const proxy = "https://dawn-math-e508.themoontama.workers.dev/?url=";
  document.getElementById("viewer").src = proxy + encodeURIComponent(url);
}
</script>

</body>
</html>
